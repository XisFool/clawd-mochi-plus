const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');
const playPause=document.getElementById('playPause'),nextButton=document.getElementById('nextFrame');
let selected=null,frame=0,running=false,completed=false,nextAt=0,framesPlayed=0,loopsPlayed=0;
function paint(){
  ctx.drawImage(selected.images[frame],0,0);framesPlayed++;
  document.getElementById('currentName').textContent=selected.label;
  document.getElementById('playState').textContent=selected.images.length===1?'静态表情':completed?'播放完成':running?'播放中':'已暂停';
  document.getElementById('frameInfo').textContent=selected.images.length===1?'命令 '+selected.key:('第 '+(frame+1)+' / '+selected.images.length+' 帧 · '+(selected.loop?selected.ms*selected.images.length+'ms / 轮':'单次动画')+' · 命令 '+selected.key);
  playPause.disabled=selected.images.length===1;nextButton.disabled=selected.images.length===1;
  playPause.textContent=running?'暂停':completed?'重播':'播放';
}
function select(key){
  selected=expressions.find(item=>item.key===key);frame=0;completed=false;running=selected.images.length>1;nextAt=performance.now()+selected.ms;framesPlayed=0;loopsPlayed=0;
  document.querySelectorAll('.expr').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.key===key)));paint();
}
function advance(manual=false){
  if(frame+1<selected.images.length)frame++;
  else if(selected.loop||manual){frame=0;loopsPlayed++;}
  else{running=false;completed=true;}
  paint();
}
playPause.addEventListener('click',()=>{
  if(completed){select(selected.key);return;}
  running=!running;nextAt=performance.now()+selected.ms;paint();
});
nextButton.addEventListener('click',()=>{running=false;completed=false;advance(true);});
function tick(now){
  if(selected&&running&&now>=nextAt){advance();nextAt=now+selected.ms;}
  requestAnimationFrame(tick);
}
window.previewState=()=>({key:selected?.key,frame,running,completed,frames: selected?.images.length,period:selected?.ms,loopsPlayed,framesPlayed});
async function init(){
  for(const [index,item] of expressions.entries()){
    item.images=await Promise.all(item.frames.map(url=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=url;})));
    const button=document.createElement('button');button.className='expr';button.dataset.key=item.key;button.setAttribute('aria-pressed','false');button.title='命令 '+item.key+' / 别名 '+item.alias;
    const image=document.createElement('img');image.src=item.frames[0];image.alt='';const label=document.createElement('span');label.textContent=item.label;button.append(image,label);button.addEventListener('click',()=>select(item.key));document.getElementById(index<5?'newExpressions':'existingExpressions').append(button);
  }
  select('w');window.previewReady=true;requestAnimationFrame(tick);
}
init().catch(()=>{document.getElementById('error').textContent='加载失败，请刷新页面。';});
</script>
